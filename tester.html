<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Test iXRLibForWebXR.js</title>
  <!-- Include your bundled JS file -->
  <script src="dist/iXRLibForWebXR.js"></script>
  <script>
    // Define a global function that uses the library.
    // You can place this inside or outside a <script> tag,
    // as long as it runs after iXRLibForWebXR.js is loaded.
    let setupiXRLib = async function() {
      console.log("Starting iXRLib setup!");
      // Update these calls to use the iXRLib namespace
      console.log("Executing iXRLibBaseSetup.SetAppConfig()");
      iXRLib.iXRLibBaseSetup.SetAppConfig();
      console.log(" - iXRLibBaseSetup.SetAppConfig() completed");

      console.log("Executing iXRLibInit.InitStatics()");
      iXRLib.iXRLibInit.InitStatics();
      console.log(" - iXRLibInit.InitStatics() completed");

      console.log("Executing iXRLibInit.Start()");
      iXRLib.iXRLibInit.Start();
      console.log(" - iXRLibInit.Start() completed");

      console.log("Executing iXRLibInit.Authenticate()");
      await iXRLib.iXRLibInit.Authenticate(
        '471fd6fd-f5d0-4096-bc0c-17100c1c4fa0',
        '5304ef74-423f-4bd4-87d9-cba4f19c3bdb',
        'iXRLibForWebXR_js',
        'vEwWpJs5K2Kib3XeWBhXgQnQr43XNJCSyb5QJoGCU5ec590hFyb63vBSx6dX6Clj',
        'arborxrs'
      );
      console.log(" - iXRLibInit.Authenticate() completed");
    };
  </script>
</head>
<body>
  <h1>Testing iXRLibForWebXR.js</h1>
  <button onclick="setupiXRLib()">Setup iXRLib</button>
</body>
